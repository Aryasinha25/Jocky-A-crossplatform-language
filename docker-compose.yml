version: "3.8"

services:
  jocky-control-plane:
    build: 
      context: ./control-plane
    ports:
      - "8080:8080"
    environment:
      - JOCKY_SERVER_HOST=0.0.0.0
      - JOCKY_SERVER_PORT=8080
      - JOCKY_DATABASE_URL=postgres://jocky:jockysecret@postgres:5432/jocky?sslmode=disable
      - JOCKY_API_KEY=dev_secret_key_123
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=jocky
      - POSTGRES_PASSWORD=jockysecret
      - POSTGRES_DB=jocky
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jocky -d jocky"]
      interval: 5s
      timeout: 5s
      retries: 5
