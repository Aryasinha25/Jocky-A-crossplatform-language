- id: PROC-SUSPICIOUS-NAME-001
  name: Suspicious Process Name
  description: Detects process names commonly associated with test or suspicious execution.
  severity: medium
  evidence_type: process
  conditions:
    - !equals
      field: name
      value: "example.exe"

- id: PROC-SUSPICIOUS-NAME-002
  name: Suspicious Process Name (Contains)
  description: Detects process names containing suspicious keywords.
  severity: low
  evidence_type: process
  conditions:
    - !contains
      field: name
      value: "suspicious"
